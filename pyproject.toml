[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_final"
version = "0.1.0"
description = "TEMPPO: TEmplate-Matched Proposals for PPO"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Ole Rößler" }]

dependencies = [
    "torch",
    "gymnasium",
    "numpy<2",
    "minigrid",
    "networkx",
    "pandas<3",
    "matplotlib",
    "moviepy",
    "tqdm",
    "hydra-core>=1.3",
    "rliable",
    "arch==7.2.0",
    "tensorboard",
    "setuptools<81",
    "ollama",
    "anthropic",
    "dotenv",
    "pydantic",
    "typing",
    "ipykernel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
    "pre-commit",
    "cloudpickle",
]

hpo = [
    "hypersweeper[dehb]",
    "hydra-joblib-launcher",
]

[project.scripts]
rl-final-train = "rl_final.ppo.ppo_minigrid:cli"

[tool.setuptools.packages.find]
where = ["src"]

# --- Formatters / linters ---------------------------------------------------

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N806", "N803", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rl_final"]

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not slow'"
testpaths = ["tests"]
markers = [
    "slow: end-to-end runs that actually train (deselected by default; `pytest -m slow`)",
]
