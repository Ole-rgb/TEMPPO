[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl_final"
version = "0.1.0"
description = "Cost of Curiosity: When Do Novelty-Based Exploration Bonuses Hurt?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ole Rößler" }]

dependencies = [
    "torch",
    "gymnasium",
    "minigrid",
    "numpy",
    "pandas<3",
    "matplotlib",
    "tqdm",
    "hydra-core>=1.3",
    "rliable",
    "arch==7.2.0",
    "tensorboard",
    "ollama",
    "anthropic",
    "dotenv",
    "pydantic",
    "typing",
    "ipykernel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

# --- Formatters / linters ---------------------------------------------------

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["N806", "B008"]

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
