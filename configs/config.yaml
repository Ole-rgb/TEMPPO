defaults:
  - env: empty_5x5
  - bonus: none
  - _self_

hydra:
  sweep:
    subdir: ${hydra.job.override_dirname}

exp_name: ppo_minigrid
seed: 0
torch_deterministic: true
cuda: true
capture_video: false

# `env_id` is what the training script reads; the env group owns the actual value.
env_id: ${env.gym_id}

# --- PPO ---------------------------------------------------------------------
total_timesteps: 100000
learning_rate: 2.5e-4
num_envs: 4
num_steps: 128
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
num_minibatches: 4
update_epochs: 4
norm_adv: true
clip_coef: 0.2
clip_vloss: true
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null

# --- Evaluation --------------------------------------------------------------
eval_interval: 10      # run an eval every N policy-update iterations
eval_episodes: 10

# --- Bonus internals ---------------------------------------------------------
# Held FIXED across every condition. The bonus/ group flips ONLY the two
# coefficients, so an ablation can never accidentally vary these as well.
rnd:
  beta: 0.1
  predictor_hidden_dim: 64
  predictor_lr: 1e-4
  normalize_intrinsic_reward: true
  normalize_observation: true

llm:
  beta: 0.5            # the swept coefficient -- this is the headline result
  subgoal_bonus: 1.0   # reward paid once per subgoal completion
  model: claude-haiku-4-5
  cache_path: scripts/subgoal_cache_claude-haiku-4-5.jsonl
