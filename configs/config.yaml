defaults:
  - env: empty_5x5
  - bonus: none
  - _self_

exp_name: ppo_minigrid
seed: 0
torch_deterministic: true
cuda: false
capture_video: false

# `env_id` is what the training script reads; the env group owns the actual value.
env_id: ${env.gym_id}

# --- PPO ---------------------------------------------------------------------
total_timesteps: 100000

schedule_timesteps: null
learning_rate: 2.5e-4
num_envs: 4
num_steps: 128
anneal_lr: true
gamma: 0.99
gae_lambda: 0.95
num_minibatches: 4
update_epochs: 4
norm_adv: true
clip_coef: 0.2
clip_vloss: true
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: null

# --- Evaluation --------------------------------------------------------------
# Owned by the env group: it follows max_steps, so any run of an env gets the
# right value without remembering to pass one.
eval_interval: ${env.eval_interval}
eval_episodes: 20

# What `main` returns to an HPO sweeper.
objective: auc

# --- Bonus internals ---------------------------------------------------------
# Held FIXED across every condition. The bonus/ group flips ONLY the two
# coefficients, so an ablation can never accidentally vary these as well.
rnd:
  beta: 0.001
  predictor_hidden_dim: 512
  predictor_lr: 1e-3
  embed_dim: 512
  normalize_intrinsic_reward: true

llm:
  beta: 0.25
  subgoal_bonus: 1.0
  model: claude-opus-4-8
  cache_path: scripts/subgoal_cache_claude-opus-4-8.jsonl
  cache_only: false
  skip_go_to_goal: false
  # Control arm: permute each bound plan, keeping the same subgoals and total bonus.
  shuffle_plan: false
