# @package _global_
# DEHB search: the PPO+RND baseline.
defaults:
  - _base
  - override /bonus: rnd
  - _self_

hydra:
  sweeper:
    search_space:
      hyperparameters:
        rnd.beta:
          type: uniform_float
          lower: 0.00001
          upper: 0.01
          log: true
          default_value: 0.001
