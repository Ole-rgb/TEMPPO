# PPO+RND+LLM with the subgoal bonus annealed off: beta_llm decays linearly to 0 over
# the first `anneal_llm_frac` of the run. A fraction, not a step count, so the condition
# means the same thing at any budget. It resolves against schedule_timesteps if that is
# set, else total_timesteps. Set frac OR steps, never both; 0 steps means never anneal.
name: rnd_llm_warmstart
beta_rnd: ${rnd.beta}
beta_llm: ${llm.beta}
anneal_llm_frac: 0.35
